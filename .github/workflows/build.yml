name: navicat-keygen builds
on: [push,workflow_dispatch]

jobs:
  navicat-keygen-x64:
    runs-on: windows-latest
    steps:
      - name: Install dependencies
        run: |
          vcpkg install fmt:x64-windows-static
          vcpkg install openssl:x64-windows-static
          vcpkg install rapidjson:x64-windows-static
          vcpkg install keystone:x64-windows-static
          vcpkg install unicorn:x64-windows-static

      - name: Clone source
        uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build project
        run: |
          vcpkg integrate install
          msbuild navicat-keygen.sln /p:Configuration=Release /p:Platform=x64

      - name: Create zip package
        shell: pwsh
        run: Compress-Archive -Path bin/x64-Release/*.exe -DestinationPath navicat-keygen-x64.zip
  
      - name: Upload artifacts
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          files: navicat-keygen-x64.zip
